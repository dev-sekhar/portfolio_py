name: Daily Portfolio Data Fetch

on:
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * *" # Run daily at midnight UTC; adjust as needed

jobs:
    run-portfolio:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: 3.10

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt  # make sure mysql-connector-python, python-dotenv, yfinance etc are listed

            - name: Run daily portfolio data script
              env:
                  DB_HOST: ${{ secrets.DB_HOST }}
                  DB_NAME: ${{ secrets.DB_NAME }}
                  DB_USER: ${{ secrets.DB_USER }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: python run_daily.py
